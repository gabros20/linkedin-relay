name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # typecheck + lint + 273 tests. No test touches the network: the engine
      # is injected, so CI never needs a LinkedIn session.
      - run: bun run check
      - run: bun run build
