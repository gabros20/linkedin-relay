name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No registry-url here on purpose. setup-node would write an .npmrc that
      # authenticates via NODE_AUTH_TOKEN, and that empty credential overrides
      # the one semantic-release derives from NPM_TOKEN — producing a 401 that
      # looks exactly like a bad token. semantic-release manages npm auth itself.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      # semantic-release derives the version and CHANGELOG from the Conventional
      # Commits already in history. Never bump a version by hand.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
